---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build CLI and example
        run: |
          go build ./cmd/otgo
          go build ./examples/webapp
      - name: Test pinned upstream WebSocket codec
        if: runner.os == 'Linux'
        run: |
          rustup update stable --no-self-update
          rustup default stable
          python3 scripts/upstream_compat.py
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      # golangci/golangci-lint-action v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          install-only: true
      - name: Check formatting and lint all packages
        run: |
          golangci-lint fmt --diff
          golangci-lint run ./...

  current-go:
    name: Current Go security checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Test on the current supported Go release
        run: go test ./...
      - name: Check for reachable known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Sustained fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Fuzz protocol parsers, routing and authentication boundaries
        run: make fuzz-sustained
      # actions/upload-artifact v4.6.2. Fuzz crashes are written by Go under
      # testdata/fuzz and retained even when the job fails.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fuzz-corpus-and-crashes
          path: |
            testdata/fuzz
            internal/authproxy/testdata/fuzz
            identity/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 14
