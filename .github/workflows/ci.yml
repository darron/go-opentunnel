---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test Homebrew updater
        run: python3 -m unittest discover -s scripts -p 'test_update_homebrew.py'
      - name: Build CLI and example
        run: |
          go build ./cmd/otgo
          go build ./examples/webapp
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.x'
      # golangci/golangci-lint-action v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          install-only: true
      - name: Check formatting and lint all packages
        run: |
          golangci-lint fmt --diff
          golangci-lint run ./...
