version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - unconvert
    - wastedassign
  settings:
    gosec:
      excludes:
        # The SDK forwards to caller-selected host:port targets.
        - G704
        # Storage validates runtime profile paths and rejects symlinked
        # profiles/files before filesystem access.
        - G304
    errcheck:
      check-type-assertions: true
      check-blank: false
  exclusions:
    presets: []
formatters:
  enable:
    - gofmt
